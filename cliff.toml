[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true

[git]
# Subjects are "<Area>: <what changed>"; the area picks the section.
conventional_commits = false
filter_unconventional = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^(Firmware|HTTP|Web console|Decoder|Protocol|Core)", group = "Firmware and protocol" },
  { message = "^(Docs|Decisions|README|design)", group = "Documentation" },
  { message = "^Build\\(deps\\)", group = "Dependencies" },
  { message = ".*", group = "Maintenance" },
]
