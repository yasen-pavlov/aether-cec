[workspace]
resolver = "3"
members = ["crates/cec-core", "crates/aether-proto", "crates/aether-logic"]
# firmware/ stays standalone because it requires the Xtensa toolchain.

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yasen-pavlov/aether-cec"
rust-version = "1.87"

[workspace.dependencies]
heapless = { version = "0.9", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
