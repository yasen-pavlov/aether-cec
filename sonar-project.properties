sonar.projectKey=yasen-pavlov_aether-cec
sonar.organization=yasen-pavlov
sonar.projectName=aether-cec
# The whole repository is analysed; scope is narrowed with exclusions only
# (sonar.sources / sonar.tests have no effect on this project).
sonar.sourceEncoding=UTF-8
# sonar.rust.lcov.reportPaths is passed by CI as an absolute path (see ci.yml).
# The embedded web console is one hand-compacted file under a flash-size budget; its
# dense style (several statements per line, nested ternaries) is deliberate.
# docs/design holds exported design canvases (templated HTML), not product code.
sonar.exclusions=firmware/src/index.html,docs/design/**
# The firmware package only runs on the ESP32; its testable logic lives in crates/aether-logic.
sonar.coverage.exclusions=firmware/**
