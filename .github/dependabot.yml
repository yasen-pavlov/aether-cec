version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
  # firmware/Cargo.lock is not listed: Dependabot cannot resolve it because
  # firmware/rust-toolchain.toml selects the esp toolchain. It is updated by
  # hand (see AGENTS.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
