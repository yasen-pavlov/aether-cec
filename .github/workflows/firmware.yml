name: Firmware
# Reusable: CI builds every change, the release workflow builds tags with a version.
on:
  workflow_call:
    inputs:
      version:
        description: Tag to report as status.fw (leading v stripped); empty reports 0.0.0+<commit>
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      # Pinned to the compiler the bench images are built with; firmware/rust-toolchain.toml selects it.
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        env:
          # espup resolves the toolchain version through the GitHub API; without a
          # token the shared runner address runs into the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 1.97.0.0
          buildtargets: esp32
          ldproxy: true
          override: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware
          key: esp-1.97.0.0
          # ESP-IDF sources and tools (ESP_IDF_TOOLS_INSTALL_DIR = "global").
          cache-directories: ~/.espressif
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: espflash@4.7.0
      - run: cargo fmt --check
      # One step on purpose: the script packages the bootloader and sdkconfig of
      # the build it ran itself, as reported by Cargo.
      - name: Build, check sdkconfig and slot size, package images
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          AETHER_VERSION="${VERSION#v}" ../scripts/package-firmware.sh "$RUNNER_TEMP/firmware" | tee "$RUNNER_TEMP/package.log"
          tail -n 1 "$RUNNER_TEMP/package.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware/
          retention-days: 14
          if-no-files-found: error
