name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
      - name: no_std build of the core crates
        run: cargo build --locked -p aether-cec-core -p aether-cec-proto --target thumbv7em-none-eabi
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 14
          if-no-files-found: error
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared rust-version
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-features --all-targets --locked
  firmware:
    uses: ./.github/workflows/firmware.yml
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the OpenAPI contract
        run: npx --yes @redocly/cli@2.78.0 lint docs/openapi.yaml
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments '*.md' 'docs/*.md' 'tests/fixtures/*.md'
          fail: true
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    needs: [rust]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: .
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
