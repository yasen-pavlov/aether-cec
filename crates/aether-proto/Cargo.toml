[package]
name = "aether-cec-proto"
description = "Serde types for the aether MQTT protocol (docs/protocol.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "aether_proto"

[features]
default = []
std = ["serde/std", "dep:serde_json", "serde_json/std"]

[dependencies]
cec-core = { package = "aether-cec-core", path = "../cec-core" }
heapless = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
